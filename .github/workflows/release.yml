name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/release/forge dist/
          cp README.md LICENSE dist/
          tar -czf flowforge-${{ matrix.target }}.tar.gz -C dist .
          shasum -a 256 flowforge-${{ matrix.target }}.tar.gz > flowforge-${{ matrix.target }}.tar.gz.sha256

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/forge.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath flowforge-${{ matrix.target }}.zip
          Get-FileHash flowforge-${{ matrix.target }}.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  flowforge-${{ matrix.target }}.zip" } | Set-Content flowforge-${{ matrix.target }}.zip.sha256

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flowforge-${{ matrix.target }}.*
