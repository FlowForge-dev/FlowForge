[package]
name = "forgeflow"
version = "0.1.0"
edition = "2024"
authors = ["ForgeFlow Contributors"]
description = "Terminal-first AI automation platform for developers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/forgeflow/forgeflow"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
dirs = "6.0"
futures-util = "0.3"
ignore = "0.4"
indicatif = "0.18"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.8"
tempfile = "3.23"
